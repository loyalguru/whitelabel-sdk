<!DOCTYPE html>
<html>
<head>
  <title>Test SDK</title>
  <script src="https://storage.googleapis.com/cdn-sdk-streaming-west/sdk/embed-sdk.umd.js"></script>
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0">
  <div id="loyalty-container"></div>

  <script>
    const config = {
      ...window.EMBED_SDK_CONFIG,
      ...(window.EMBED_SDK_CONFIG_LOCAL || {}),
    };

    EmbedLoyaltyApp.init({
      containerId: 'loyalty-container',
      module: '', //home | rewards | challenges | accounts
      iframeOrigin: config.iframeOrigin,
      token: config.token,
      locale: config.locale,
      autoResize: config.autoResize, //For mobile apps set on false
      gtmEnabled: config.gtmEnabled ?? true,
      onLoad: () => console.log('[host] Iframe loaded'),
      onSize: ({ height }) => console.log('[host] iframe height:', height),
      onData: ({ payload, origin }) => console.log('[host] onData:', origin, payload),
      onTracking: ({ payload, origin }) => console.log('[host] onTracking:', origin, payload),
      onError: (err) => console.error('[SDK] error', err),
      onServerError: (serverError) => console.warn('[SDK] server error', serverError)
    });

    EmbedLoyaltyApp.onTokenRefreshRequested(async () => {
      const refreshToken = config.refreshToken;
      if (!refreshToken || refreshToken === 'YOUR_JWT_TOKEN_HERE' || refreshToken === 'YOUR_REFRESH_JWT_TOKEN_HERE') {
        console.warn('[host] Token refresh requested but no config.refreshToken is configured in config.local.js');
        return;
      }
      EmbedLoyaltyApp.refreshToken(refreshToken);
    });
    EmbedLoyaltyApp.onSizeRequested(({ height, width }) => {});

    EmbedLoyaltyApp.onDataRequested(({ payload }) => {
      console.log('Payload on data', payload)
    });
  </script>
</body>
</html>
